services:
  db:
    container_name: db
    image: postgres:latest
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - ./infastructure/local-postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
